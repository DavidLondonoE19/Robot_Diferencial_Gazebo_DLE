# Control de Xbox por cable (driver xpad):
#   ejes:    0 LX, 1 LY, 2 LT, 3 RX, 4 RY, 5 RT, 6 cruceta X, 7 cruceta Y
#   botones: 0 A, 1 B, 2 X, 3 Y, 4 LB, 5 RB, 6 Back, 7 Start, 8 Xbox, 9 LS, 10 RS
# Verificar con:  ros2 run joy joy_node  +  ros2 topic echo /joy
joy_node:
  ros__parameters:
    device_id: 0
    deadzone: 0.08
    autorepeat_rate: 20.0       # [Hz] publica aunque el stick no cambie (twist_mux tiene timeout 0.5 s)

teleop_twist_joy_node:
  ros__parameters:
    require_enable_button: true
    enable_button: 4            # LB: hombre muerto, hay que mantenerlo para mover el robot
    enable_turbo_button: 5      # RB: velocidad máxima
    axis_linear:
      x: 1                      # stick izquierdo, vertical
    scale_linear:
      x: 0.5                    # [m/s]
    scale_linear_turbo:
      x: 1.0                    # [m/s] límite del robot
    axis_angular:
      yaw: 3                    # stick derecho, horizontal
    scale_angular:
      yaw: 2.0                  # [rad/s]
    scale_angular_turbo:
      yaw: 4.0                  # [rad/s] límite del robot
